name: Morpheus Python and Container Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application dependencies
        run: python -m pip install -r requirements-preview.txt
      - name: Run all Python tests
        env:
          MORPHEUS_ENV: development
        run: python -m unittest discover -s validation -p "test_*.py" -v
      - name: Build production-compatible Docker image
        run: docker build -t morpheus:ci .
      - name: Start development-configured container
        run: docker run -d --rm --name morpheus-ci -p 8080:8080 -e MORPHEUS_ENV=development morpheus:ci
      - name: Verify container HTTP health and product discovery
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /tmp/morpheus-health.json; then break; fi
            sleep 1
          done
          python -c 'import json; d=json.load(open("/tmp/morpheus-health.json")); assert d["status"] == "ok" and d["mode"] == "SIMULATED" and d["production_activation"] is False'
          curl --fail --silent http://127.0.0.1:8080/api/products > /tmp/morpheus-products.json
          python -c 'import json; d=json.load(open("/tmp/morpheus-products.json")); assert d["mode"] == "SIMULATED" and d["activation_enabled"] is False'
      - name: Verify production fails closed until real adapters exist
        run: |
          if docker run --rm -e MORPHEUS_ENV=production morpheus:ci python -c 'import api'; then
            echo "ERROR: production accepted simulated adapters"
            exit 1
          fi
      - name: Container diagnostics
        if: failure()
        run: docker logs morpheus-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f morpheus-ci || true
